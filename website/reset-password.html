<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sakhi 🌸 | Reset Password</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .auth-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(228, 114, 151, 0.15);
            text-align: center;
        }
        .auth-input {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: 2px solid #FFE4E6;
            border-radius: 12px;
            font-size: 16px;
            font-family: 'Outfit', sans-serif;
            box-sizing: border-box;
        }
        .auth-input:focus {
            outline: none;
            border-color: #E47297;
        }
        .status-message {
            margin-top: 15px;
            font-weight: 600;
            color: #E47297;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Sakhi 🌸</div>
    </nav>

    <div class="auth-container" id="reset-form-container" style="display: none;">
        <h2>Set New Password</h2>
        <p>Enter your new password below.</p>
        
        <input type="password" id="new-password" class="auth-input" placeholder="New Password (min 6 chars)">
        <input type="password" id="confirm-password" class="auth-input" placeholder="Confirm New Password">
        
        <button id="reset-btn" class="btn primary-btn" style="width: 100%; margin-top: 15px;" onclick="updatePassword()">Update Password</button>
        <div id="status-message" class="status-message"></div>
    </div>

    <div class="auth-container" id="error-container" style="display: none;">
        <h2>Invalid or Expired Link ⚠️</h2>
        <p>This password reset link is invalid or has expired. Please request a new one from the app.</p>
        <p style="font-size: 11px; color: #aaa; margin-top: 20px; word-break: break-all;" id="debug-url"></p>
    </div>

    <div class="auth-container" id="success-container" style="display: none;">
        <h2>Password Updated! 🎉</h2>
        <p>Your password has been changed successfully. You can now return to the Sakhi app and log in.</p>
    </div>

    <script>
        // Initialize Supabase Client using the public credentials
        const SUPABASE_URL = 'https://sstiexjgfdyxsybooldf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNzdGlleGpnZmR5eHN5Ym9vbGRmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MjE0MjQsImV4cCI6MjA5Njk5NzQyNH0.UDhVUZ38UwWF_11pnQphO9ySIuVwewVw8Z9OE6RFFMA';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Check if the URL contains the access token (Implicit flow) or code (PKCE flow)
        window.onload = async function() {
            const hash = window.location.hash;
            const search = window.location.search;
            console.log("URL Hash:", hash, "URL Search:", search);
            
            // Show the URL on the error page just in case we need to debug
            document.getElementById('debug-url').innerText = "URL: " + window.location.href;

            // 1. PKCE Flow (Modern Supabase default)
            if (search && search.includes("code=")) {
                const urlParams = new URLSearchParams(search);
                const code = urlParams.get('code');
                
                if (code) {
                    const { data, error } = await supabaseClient.auth.exchangeCodeForSession(code);
                    if (!error) {
                        document.getElementById('reset-form-container').style.display = 'block';
                        return; // Success
                    } else {
                        console.error("Exchange Code Error:", error);
                    }
                }
            }
            
            // 2. Implicit Flow (Older Supabase)
            if (hash && hash.includes("access_token")) {
                document.getElementById('reset-form-container').style.display = 'block';
                return; // Success
            }
            
            // If neither flow succeeded, show error
            document.getElementById('error-container').style.display = 'block';
        };

        async function updatePassword() {
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const statusEl = document.getElementById('status-message');

            if (password.length < 6) {
                statusEl.innerText = "Password must be at least 6 characters.";
                return;
            }
            if (password !== confirm) {
                statusEl.innerText = "Passwords do not match.";
                return;
            }

            statusEl.innerText = "Updating password...";
            document.getElementById('reset-btn').disabled = true;

            const { error } = await supabaseClient.auth.updateUser({
                password: password
            });

            if (error) {
                statusEl.innerText = "Error: " + error.message;
                document.getElementById('reset-btn').disabled = false;
            } else {
                document.getElementById('reset-form-container').style.display = 'none';
                document.getElementById('success-container').style.display = 'block';
            }
        }
    </script>
</body>
</html>
